version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stamp-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/db/app.db
    volumes:
      - ./db:/data/db
    networks:
      - stamp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stamp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - stamp-network
    restart: unless-stopped

volumes:
  db-data:

networks:
  stamp-network:
    driver: bridge
