#stamp-atelier-citron .atelier.variant-whiteglass .stamp-item .stamp-qty span{color:var(--p-primary)}
#stamp-atelier-citron .atelier.variant-whiteglass .stamp-item strong{color:var(--p-ink)}
#stamp-atelier-citron .atelier.variant-whiteglass .stamp-item>span{color:var(--p-muted)}
#stamp-atelier-citron .atelier.variant-whiteglass .stamp-item[aria-pressed=true]{box-shadow:0 0 0 1.5px var(--p-primary),0 3px 10px #6C4B6017!important}
</style>
<div id="stamp-atelier-citron" aria-label="Kanban blanc avec cartes Liquid Glass">
<div class="stamp-screen surface refined bear contrast liquid optics palette-screen atelier rowhero variant-solid variant-whiteglass liquidcards" data-screen="contrast" data-palette="prune" aria-label="Prune douce, citron et Liquid Glass"></div>
</div>
<script>
(()=>{
const root=document.getElementById('stamp-atelier-citron');
const palettes={"encre":{"name":"Encre & vermillon","bg":"#E3E5E8","paper":"#FFFFFF","group":"#D2D8E1","ink":"#24334A","muted":"#465469","primary":"#283F61","accent":"#B94434","accentInk":"#FFFFFF","line":"#B2BCCB"},"prune":{"name":"Prune & safran","bg":"#E6E1E5","paper":"#FFFCFD","group":"#D4CAD2","ink":"#382735","muted":"#594856","primary":"#693B55","accent":"#D39B27","accentInk":"#382735","line":"#B8A9B3"},"cobalt":{"name":"Cobalt & mandarine","bg":"#E4E7EA","paper":"#FFFFFF","group":"#CCD5E0","ink":"#283044","muted":"#475369","primary":"#2F4EA2","accent":"#BF542D","accentInk":"#FFFFFF","line":"#AAB8CB"},"graphite":{"name":"Graphite & cerise","bg":"#E3E1E2","paper":"#FFFFFF","group":"#D1CCCE","ink":"#332C30","muted":"#594C53","primary":"#40353C","accent":"#A72D4E","accentInk":"#FFFFFF","line":"#B4ABAF"}};
const columns=[['À commander',[['Papier Sauge','Collection Jardin calme','12 feuilles'],['Ruban écru','Largeur 10 mm','3 mètres']]],['Commandé',[['Papier Pétale','Collection Douce saison','8 feuilles']]],['Reçu',[['Papier Lin','Collection Jardin calme','16 feuilles'],['Ruban olive','Largeur 6 mm','2 mètres']]],['À traiter',[['Papier Terracotta','Collection Douce saison','6 feuilles']]],['Traité',[['Papier Crème','Collection Jardin calme','10 feuilles']]]];
const nav=[['users','Clientes'],['layers','Catalogue'],['shopping-bag','Commandes'],['scissors','Fournitures'],['archive','Stocks'],['chart-no-axes-combined','Bilan']];
root.querySelectorAll('[data-screen]').forEach(screen=>{
const palette=palettes[screen.dataset.palette];if(!screen.classList.contains('atelier'))Object.entries(palette).forEach(([key,value])=>{if(key!=='name')screen.style.setProperty('--p-'+key,value);});
screen.innerHTML=`<header class="stamp-top"><div class="stamp-brand">Stamp App</div><small>L’atelier · Gestion du scrapbooking</small></header><div class="stamp-page-head"><div><h2>Fournitures</h2><p class="stamp-caption">Tout le nécessaire, du papier commandé au travail terminé.</p></div><div class="stamp-period"><button type="button" aria-label="Mois précédent"><i data-lucide="chevron-left" aria-hidden="true"></i></button><span>Octobre 2026</span><button type="button" aria-label="Mois suivant"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div></div><div class="stamp-toolbar"><div class="stamp-summary"><span><b>62</b> feuilles</span><span><b>5 m</b> de ruban</span><span><b>7</b> piles</span></div><span class="stamp-tab">Mon atelier en cours</span></div><main class="stamp-board" aria-label="Traitement des cartes du Kanban">${columns.map(([name,items])=>`<section class="stamp-column" aria-label="${name}"><h3 class="stamp-column-head">${name}<span class="stamp-count">${items.length}</span></h3>${items.map(([title,subtitle,qty])=>`<button type="button" class="stamp-item cursor-interaction" data-title="${title}" data-qty="${qty}"><strong>${title}</strong><span>${subtitle}</span><span class="stamp-qty"><span>${qty}</span><i data-lucide="arrow-up-right" aria-hidden="true"></i></span></button>`).join('')}</section>`).join('')}</main><div class="stamp-dock-wrap"><nav class="stamp-dock" aria-label="Navigation principale">${nav.map(([icon,label])=>`<button type="button" class="cursor-interaction" ${label==='Fournitures'?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('')}</nav><span class="stamp-scissors" aria-hidden="true"><i data-lucide="scissors"></i></span></div><footer class="stamp-foot"><span>Octobre · Vue mensuelle</span><span data-feedback aria-live="polite">Données de démonstration</span></footer><div class="stamp-detail" hidden><section class="stamp-detail-content" role="dialog" aria-modal="true" aria-label="Aperçu de pile"><h3></h3><p></p><button type="button" class="cursor-interaction" data-close>Fermer l’aperçu</button></section></div>`;
if(screen.classList.contains('atelier')){
const hero=document.createElement('div');hero.className='stamp-hero';hero.setAttribute('aria-label','Composition du bandeau');screen.prepend(hero);
hero.append(screen.querySelector('.stamp-top'),screen.querySelector('.stamp-page-head'));
if(screen.classList.contains('rowhero')){
const brandRow=hero.querySelector('.stamp-top');brandRow.querySelector('small')?.remove();
const label=hero.querySelector('h2'),caption=hero.querySelector('.stamp-caption'),period=hero.querySelector('.stamp-period');
hero.replaceChildren(brandRow,label,caption,period);
}
}
const feedback=screen.querySelector('[data-feedback]');
if(screen.dataset.screen==='refined'||screen.dataset.screen==='bear'||screen.dataset.screen==='contrast'){
  screen.querySelector('.stamp-brand').innerHTML='Stamp <small>APP</small>';
  screen.querySelector('.stamp-tab').textContent='Mon atelier';
  screen.querySelector('.stamp-caption').textContent='Les fournitures du mois, de la commande au travail terminé.';
}
if(screen.dataset.screen==='contrast')screen.querySelector('.stamp-brand').textContent='Stamp App';
screen.querySelector('.stamp-summary b').textContent='52';
if(screen.classList.contains('bear')){
screen.querySelectorAll('.stamp-item').forEach(button=>button.setAttribute('aria-pressed','false'));
}
screen.querySelectorAll('.stamp-dock button').forEach(button=>button.addEventListener('click',()=>{feedback.textContent=button.textContent.trim()+' · aperçu non inclus dans cette maquette';}));
screen.querySelectorAll('.stamp-period button').forEach(button=>button.addEventListener('click',()=>{feedback.textContent='Comparaison visuelle sur le même mois : octobre 2026';}));
const detail=screen.querySelector('.stamp-detail');let opener;
screen.querySelectorAll('.stamp-item').forEach(button=>button.addEventListener('click',()=>{opener=button;if(screen.classList.contains('bear')){screen.querySelectorAll('.stamp-item').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}detail.querySelector('h3').textContent=button.dataset.title;detail.querySelector('p').textContent=button.dataset.qty+' · Aperçu visuel de la pile. Le parcours métier reste à conserver.';detail.hidden=false;detail.querySelector('[data-close]').focus();}));
const close=()=>{detail.hidden=true;if(opener)opener.focus();};
detail.querySelector('[data-close]').addEventListener('click',close);
detail.addEventListener('click',event=>{if(event.target===detail)close();});
screen.addEventListener('keydown',event=>{if(!detail.hidden){if(event.key==='Escape')close();if(event.key==='Tab'){event.preventDefault();detail.querySelector('[data-close]').focus();}}});
const state={heroHeight:150,glassFill:16};
const render=()=>{screen.style.setProperty('--hero-height',state.heroHeight+'px');screen.style.setProperty('--card-glass-fill',String(state.glassFill/100));};
if(globalThis.Tweak){
const heroTweak=new Tweak({container:screen.querySelector('.stamp-hero'),onChange:render});heroTweak.addSlider(state,'heroHeight',{label:'Hauteur du bandeau',min:120,max:180,step:2,unit:'px'});
if(screen.classList.contains('variant-whiteglass')){const glassTweak=new Tweak({container:screen.querySelector('.stamp-board'),onChange:render});glassTweak.addSlider(state,'glassFill',{label:'Voile du verre',min:5,max:40,unit:'%'});}
}

});
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
// Original edge-local lens approximation, informed by kube.io's refraction study.
// Text remains on an unfiltered foreground; only the live backdrop is displaced.
root.querySelectorAll('.optics .stamp-dock, .palette-screen .stamp-item').forEach((dock,index)=>{
const layer=document.createElement('span');layer.className='stamp-glass-layer';layer.setAttribute('aria-hidden','true');dock.prepend(layer);
const chromium=/Chrom(e|ium)\//.test(navigator.userAgent)&&!(/EdgiOS|CriOS/.test(navigator.userAgent));
if(!chromium)return;
const ns='http://www.w3.org/2000/svg';
const svg=document.createElementNS(ns,'svg');svg.setAttribute('width','0');svg.setAttribute('height','0');svg.setAttribute('aria-hidden','true');svg.style.position='absolute';
const defs=document.createElementNS(ns,'defs');svg.append(defs);root.append(svg);
const id='stamp-lens-'+index;let key='';let frame;
const build=()=>{
const box=dock.getBoundingClientRect();if(!box.width||!box.height)return;
const w=Math.round(box.width),h=Math.round(box.height),r=Math.min(parseFloat(getComputedStyle(dock).borderRadius)||23,h/2);
const next=[w,h,r].join(':');if(next===key)return;key=next;
const pad=14;const density=Math.min(2,1200/w);const canvas=document.createElement('canvas');canvas.width=Math.ceil((w+pad*2)*density);canvas.height=Math.ceil((h+pad*2)*density);
const ctx=canvas.getContext('2d');if(!ctx)return;const map=ctx.createImageData(canvas.width,canvas.height);const scale=22;
for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){
const px=(x+.5)/density-pad-w/2,py=(y+.5)/density-pad-h/2;
const qx=Math.abs(px)-(w/2-r),qy=Math.abs(py)-(h/2-r),ox=Math.max(qx,0),oy=Math.max(qy,0);
const distance=Math.hypot(ox,oy)+Math.min(Math.max(qx,qy),0)-r;
let nx=0,ny=0;if(ox+oy>0){const len=Math.hypot(ox,oy);nx=Math.sign(px)*ox/len;ny=Math.sign(py)*oy/len;}else if(qx>qy)nx=Math.sign(px);else ny=Math.sign(py);
const depth=Math.max(0,-distance);const bend=distance>0?0:8.2*Math.exp(-depth/3.5)*(1-Math.exp(-depth/1.1));
const offset=(y*canvas.width+x)*4;
map.data[offset]=Math.round(127.5+255*nx*bend/scale);map.data[offset+1]=Math.round(127.5+255*ny*bend/scale);map.data[offset+2]=128;map.data[offset+3]=255;
}
ctx.putImageData(map,0,0);
const filter=document.createElementNS(ns,'filter');filter.id=id;filter.setAttribute('filterUnits','userSpaceOnUse');filter.setAttribute('x','-14');filter.setAttribute('y','-14');filter.setAttribute('width',String(w+28));filter.setAttribute('height',String(h+28));filter.setAttribute('color-interpolation-filters','sRGB');
const image=document.createElementNS(ns,'feImage');image.setAttribute('href',canvas.toDataURL());image.setAttribute('x',String(-pad));image.setAttribute('y',String(-pad));image.setAttribute('width',String(w+pad*2));image.setAttribute('height',String(h+pad*2));image.setAttribute('preserveAspectRatio','none');image.setAttribute('result','lens');filter.append(image);
const displacement=document.createElementNS(ns,'feDisplacementMap');displacement.setAttribute('in','SourceGraphic');displacement.setAttribute('in2','lens');displacement.setAttribute('scale',String(scale));displacement.setAttribute('xChannelSelector','R');displacement.setAttribute('yChannelSelector','G');filter.append(displacement);
const blur=document.createElementNS(ns,'feGaussianBlur');blur.setAttribute('stdDeviation','.45');filter.append(blur);
defs.replaceChildren(filter);layer.style.backdropFilter='url(#'+id+')';layer.style.webkitBackdropFilter='url(#'+id+')';
};
const schedule=()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(build);};
const observer=new ResizeObserver(schedule);observer.observe(dock);schedule();
window.addEventListener('pagehide',()=>{observer.disconnect();cancelAnimationFrame(frame);},{once:true});
});
})();
</script>
