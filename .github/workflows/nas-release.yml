name: Livrer Stamp App sur le NAS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/nas-publish.yml
    with:
      images-file: .github/nas-images.json
